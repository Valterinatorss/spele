<html lang="lv">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

</style>
</head>
<body>
<h1>Lido uz antarktīdu</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>1. Neietriecies putnos.</p>
  <p>2. Lidmašīnu vadi ar wasd taustiņiem.</p>
  <p>3. Izbaudi spēli!</p>
</section>
<button>Sākt spēli</button>
</body>
</html>
