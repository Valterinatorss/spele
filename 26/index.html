<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lido uz Antarktīdu</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #edf5ff; color: #0f1a24; }
button { background-color: #369bff; color: white; border: 0; border-radius: 8px; }
h1 { text-align: center; }
</style>
</head>
<body>
<h1>Lido uz Antarktīdu</h1>
<p>Lido garām kalniem.</p>
<img src="atteli/varonis.png" alt="varonis" width="128">
<p>Uzvaras skaņa:</p>
<audio controls src="skaņas/klikskis.wav"></audio>
<p id="punkti">Punkti: 0</p>
<button onclick="savakt()">Izvairies no kalniem</button>
<script>
// Gatava poga. Šajā tēmā mācies noformēt lapu un sakārtot failus.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
